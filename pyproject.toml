[project]
name = "hexproof"
version = "0.3.7"
description = "A comprehensive library of Magic the Gathering API utilities."
authors = [{ name = "Investigamer", email = "freethoughtleft@gmail.com" }]
license = "MPL-2.0"
readme = "README.md"
keywords = [
    "hexproof",
    "mtg",
    "scryfall",
    "magic",
    "gathering",
    "api",
    "investigamer",
]
classifiers = [
    # Development status
    "Development Status :: 4 - Beta",

    # License
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",

    # Audience and Purpose
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment :: Board Games",

    # Frameworks used
    "Framework :: Pydantic",

    # Supported Python versions
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10,<4.0"

[tool.poetry]
packages = [{ include = "hexproof" }, { include = "hexproof/py.typed" }]

[tool.poetry.urls]
Changelog = "https://github.com/Investigamer/hexproof/blob/main/CHANGELOG.md"
Discord = "https://discord.gg/magicproxies"
Issues = "https://github.com/Investigamer/hexproof/issues"
Source = "https://github.com/Investigamer/hexproof"
Sponsor = "https://patreon.com/mpcfill"

[tool.poetry.dependencies]
requests = "^2.32.4"
pydantic = ">=2.11.7"
PyYAML = ">=6.0.2"
tomlkit = ">=0.13.3"
tomli = ">=2.2.1"
loguru = "^0.7.3"
omnitils = { git = "https://github.com/pappnu/omnitils.git", branch = "dev" }
bs4 = "^0.0.2"

[tool.poetry.group.dev.dependencies]
mypy = "^1.17.1"
pytest = "^8.4.1"
commitizen = "^4.8.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.commitizen]
version = "0.3.7"
encoding = "utf-8"
tag_format = "$major.$minor.$patch"
update_changelog_on_bump = true
version_files = ["pyproject.toml:version"]

[tool.poetry.scripts]
hexproof = 'hexproof._cli:HexproofCLI'
